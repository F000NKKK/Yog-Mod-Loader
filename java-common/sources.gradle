// The Java the hosts share, for Minecraft version `mc`: what every version
// shares (src/main/java), then each java-common/mc/<range> whose range holds
// it — `1.21.1` (that version), `1.20-1.21` (every 1.20.x and 1.21.x). A
// directory's name is the one place its versions are said. Applied by every
// loader's build: `yogSharedSources(project.minecraft_version)`.

def commonDir = buildscript.sourceFile.parentFile

def parts = { String v -> v.tokenize('.').collect { it as int } }

// Whether version `v` is at least `lo`, and within `hi` on as many parts as `hi` names.
def inRange = { List<Integer> v, List<Integer> lo, List<Integer> hi ->
    def compare = { List<Integer> a, List<Integer> b, int n ->
        for (int i = 0; i < n; i++) {
            int x = i < a.size() ? a[i] : 0, y = i < b.size() ? b[i] : 0
            if (x != y) return x <=> y
        }
        0
    }
    compare(v, lo, Math.max(v.size(), lo.size())) >= 0 && compare(v, hi, hi.size()) <= 0
}

ext.yogSharedSources = { String mc ->
    def v = parts(mc)
    def dirs = [new File(commonDir, 'src/main/java')]
    new File(commonDir, 'mc').listFiles().findAll { it.isDirectory() }.sort { it.name }.each { d ->
        def range = d.name.split('-', 2)
        if (inRange(v, parts(range[0]), parts(range.length > 1 ? range[1] : range[0]))) dirs << new File(d, 'src/main/java')
    }
    dirs
}

// The loader a build is for, as the hosts' code names it: `dev.yog.YogLoader.NAME`
// (one of YogNames.Loader). Generated under build/, so a loader's platform
// sources can be another loader's (NeoForge 1.20.1 builds Forge's).
ext.yogLoaderSource = { Project project, String loaderConst ->
    def dir = new File(project.layout.buildDirectory.get().asFile, 'generated/yog-loader')
    def file = new File(dir, 'dev/yog/YogLoader.java')
    file.parentFile.mkdirs()
    def text = """// Generated by java-common/sources.gradle — don't edit.
package dev.yog;

/** The loader this host is built for. */
public final class YogLoader {
    private YogLoader() {}

    /** Its name, as the pack's overlays and the tags table name it. */
    public static final String NAME = YogNames.Loader.${loaderConst};
}
"""
    if (!file.exists() || file.text != text) file.text = text
    dir
}
