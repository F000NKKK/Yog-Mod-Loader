[package]
name = "yog-font"
version = "0.7.0"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = "MIT OR Apache-2.0"
description = "Yog fonts — one format for every font of the system: glyphs as drawing, shaping (ligatures, contextual forms, cursive joining), layout and rasterization."

[dependencies]
yog-data = { workspace = true }
# What `#[derive(Schema)]` expands to.
substrate-data = { workspace = true }
yog-graphics = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }

[[bench]]
name = "font"
harness = false
