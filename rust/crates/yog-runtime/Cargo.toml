[package]
name = "yog-runtime"
version = "0.108.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Yog runtime — native library bridging the Fabric host to Rust mods via JNI."

[lib]
# cdylib produces libyog_runtime.so / .dylib / yog_runtime.dll, loaded by the
# Fabric host via System.loadLibrary; rlib so its benches can link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The mirrors' column store.
yog-mirror = { workspace = true }
yog-event = { workspace = true }
yog-dimensions = { workspace = true }
yog-body = { workspace = true }
yog-core = { workspace = true }
yog-sync = { workspace = true }
yog-ids = { workspace = true }
# Pinned to 0.21 — 0.22 split `JNIEnv` into `Env`/`EnvUnowned` (a breaking
# rewrite of the whole FFI surface this crate uses); don't bump past 0.21.x
# without migrating every `Java_dev_yog_NativeBridge_*` signature and env
# call site to the new API first.
jni = { workspace = true }

yog-abi = { workspace = true }
yog-logging = { workspace = true }
yog-registry = { workspace = true }
yog-ui = { workspace = true }
yog-book = { workspace = true }
yog-formats = { workspace = true }
yog-gfx = { workspace = true }
yog-font = { workspace = true }
yog-graphics = { workspace = true }
yog-media = { workspace = true }
yog-inventory = { workspace = true }
yog-worldgen = { workspace = true }
yog-hot-reload = { workspace = true }
# The content blob the hosts read (`content_blob`).
yog-data = { workspace = true, features = ["json"] }

serde_json = { workspace = true }
# Dynamic mod loading: native libs (.so/.dll/.dylib) and .yog archives.
libloading = { workspace = true }
zip = { workspace = true }
# OpenGL bindings for low-level GPU access (client-side, render thread only).
glow = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# `prctl(PR_SET_PTRACER)` + `SO_PEERCRED` — see `control_socket::allow_peer_to_trace`.
libc = { workspace = true }

[features]
# Hot reload and the control socket a launcher drives it through (Yog-IDLE,
# `dev.sh --reload`): dev builds only — release builds are optimised past
# what reloading a mod's code needs, and carry none of it.
dev = []
# The benchmarks' entry points (`cargo bench --features bench`); never in a
# build of the loader.
bench = ["yog-hot-reload/testing"]

[dev-dependencies]
yog-hot-reload = { workspace = true, features = ["testing"] }
criterion = { workspace = true }

[[bench]]
name = "jni_calls"
harness = false

[[bench]]
name = "dispatch"
harness = false
required-features = ["bench"]

[[bench]]
name = "bus_calls"
harness = false
required-features = ["bench"]
