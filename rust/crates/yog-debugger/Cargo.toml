[package]
name = "yog-debugger"
version = "0.12.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "ptrace-based native debugger for Yog mods, speaking the Debug Adapter Protocol (DAP)."

[dependencies]
yog-symbols = { workspace = true }
yog-hot-reload = { workspace = true }
serde_json = { workspace = true }
yog-sync = { workspace = true }

# Telling calls from other instructions (stepping over them).
[target.'cfg(target_arch = "x86_64")'.dependencies]
iced-x86 = { workspace = true }

# The Windows backend: the debug API.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

# The Linux backend: ptrace.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }

# The macOS backend: Mach exception ports; kqueue for the process's end.
[target.'cfg(target_os = "macos")'.dependencies]
mach2 = { workspace = true }
libc = { workspace = true }
