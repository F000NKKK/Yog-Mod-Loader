[package]
name = "yog-debugger"
version = "0.13.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Native debugger for Yog mods on Linux (ptrace), Windows (the debug API) and macOS (Mach), speaking the Debug Adapter Protocol (DAP)."

[features]
# Every system call and event of a backend on stderr: for chasing a
# system's behaviour from a test run (CI), never in a release.
event-log = []

[dependencies]
yog-symbols = { workspace = true }
yog-hot-reload = { workspace = true }
serde_json = { workspace = true }
yog-sync = { workspace = true }

# Telling calls from other instructions (stepping over them).
[target.'cfg(target_arch = "x86_64")'.dependencies]
iced-x86 = { workspace = true }

# The Windows backend: the debug API.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

# The Linux backend: ptrace.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }

# The macOS backend: Mach exception ports; kqueue for the process's end.
[target.'cfg(target_os = "macos")'.dependencies]
mach2 = { workspace = true }
libc = { workspace = true }
