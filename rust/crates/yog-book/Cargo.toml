[package]
name = "yog-book"
version = "0.66.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "In-game book/documentation framework for Yog mods (Patchouli-like)."

[dependencies]
yog-registry = { version = "0.34", features = ["serde"] }
yog-ui  = "0.43"
yog-gfx = "0.28"
# The .ybook format: schema, references, texts.
yog-data = { version = "0.4", features = ["json"] }

# Serialization (for runtime JSON parsing)
serde.workspace      = true
serde_json.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
yog-gfx = { version = "0.28", features = ["testing"] }

[[bench]]
name = "book"
harness = false
