[package]
name = "yog-book"
version = "0.67.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "In-game book/documentation framework for Yog mods (Patchouli-like)."

[dependencies]
yog-registry = { workspace = true, features = ["serde"] }
yog-ui = { workspace = true }
yog-gfx = { workspace = true }
# The .ybook format: schema, references, texts.
yog-data = { workspace = true, features = ["json"] }

# Serialization (for runtime JSON parsing)
serde.workspace      = true
serde_json.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
yog-gfx = { workspace = true, features = ["testing"] }

[[bench]]
name = "book"
harness = false
