[package]
name = "yog-book"
version = "0.73.2"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = "MIT OR Apache-2.0"
description = "In-game book/documentation framework for Yog mods (Patchouli-like)."

[dependencies]
yog-ids = { workspace = true }
yog-registry = { workspace = true }
yog-sync = { workspace = true }
yog-ui = { workspace = true }
yog-gfx = { workspace = true }
# The .ybook format it draws.
yog-formats = { workspace = true }
yog-data = { workspace = true, features = ["json"] }

# Serialization (for runtime JSON parsing)
serde_json = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
yog-gfx = { workspace = true, features = ["testing"] }

[[bench]]
name = "book"
harness = false
