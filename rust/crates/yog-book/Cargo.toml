[package]
name = "yog-book"
version = "0.62.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "In-game book/documentation framework for Yog mods (Patchouli-like)."

[dependencies]
yog-registry = { version = "0.29", features = ["serde"] }
yog-ui  = "0.40.10"
yog-gfx = "0.25.3"

# Serialization (for runtime JSON parsing)
serde.workspace      = true
serde_json.workspace = true
