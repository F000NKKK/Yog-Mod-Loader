[package]
name = "yog-symbols"
version = "0.4.1"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "DWARF symbol resolution for Yog mod natives — address<->source-location lookups used by yog-debugger and yog-hot-reload."

[lib]
crate-type = ["lib"]

[dependencies]
object = { workspace = true }
gimli = { workspace = true }
addr2line = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }

[[bench]]
name = "symbols"
harness = false
