[package]
name = "yog-ui"
version = "0.51.0"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = "MIT OR Apache-2.0"
description = "Yog UI framework — flexbox and WPF-style grid layout + GPU rendering via yog-gfx"

[dependencies]
yog-sync = { workspace = true }
yog-ids = { workspace = true }
yog-data = { workspace = true }
# What `#[derive(Schema)]` expands to.
substrate-data = { workspace = true }
yog-gfx = { workspace = true }
yog-abi = { workspace = true }

[dev-dependencies]
yog-gfx = { workspace = true, features = ["testing"] }
criterion = { workspace = true, features = ["cargo_bench_support"] }

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "text"
harness = false

[[bench]]
name = "hit_test"
harness = false
