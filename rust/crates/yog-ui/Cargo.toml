[package]
name = "yog-ui"
version = "0.41.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Yog UI framework — flexbox and WPF-style grid layout + GPU rendering via yog-gfx"

[dependencies]
yog-gfx = "0.26"
yog-abi = "0.29"

[dev-dependencies]
yog-gfx = { version = "0.26", features = ["testing"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "text"
harness = false

[[bench]]
name = "hit_test"
harness = false
