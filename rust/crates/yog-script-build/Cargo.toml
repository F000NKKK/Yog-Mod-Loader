[package]
name = "yog-script-build"
version = "0.6.1"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Yog Script's compiler: a .ys/.yns source checked against the game's class index (built from its jars) — what the Yog CLI and the yog-script tool compile with."

[dependencies]
substrate-process = { workspace = true }
# Yog Script's names.
yog-script-ids = { workspace = true }
yog-script-analyze = { workspace = true }
yog-script-run = { workspace = true }
yog-script-java = { workspace = true }
yog-mappings = { workspace = true }
yog-data = { workspace = true }
# What `#[derive(Schema)]` expands to.
substrate-data = { workspace = true }
yog-home = { workspace = true }
yog-ids = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }

[[bench]]
name = "project"
harness = false
