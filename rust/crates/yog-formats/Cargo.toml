[package]
name = "yog-formats"
version = "0.19.0"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = "MIT OR Apache-2.0"
description = "The schemas of Yog's source formats — .yblock/.yitem, .yrecipe, .ydef, .yres, yog.toml — for the build and the editors."

[dependencies]
yog-ids = { workspace = true }
yog-core = { workspace = true }
yog-data = { workspace = true, features = ["json"] }
# What `#[derive(Schema)]` expands to.
substrate-data = { workspace = true }
serde_json = { workspace = true }
# Content definitions whose format is the definition itself (`SoundGroup`).
yog-registry = { workspace = true }
# A dimension's `terrain`.
yog-sync = { workspace = true }
yog-worldgen = { workspace = true }
yog-body = { workspace = true }
yog-font = { workspace = true }
# The vocabulary as the IDE's TypeScript (`yog-formats-export`).
yog-codegen = { workspace = true }
yog-codegen-typescript = { workspace = true }
