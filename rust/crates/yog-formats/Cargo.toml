[package]
name = "yog-formats"
version = "0.7.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "The schemas of Yog's source formats — .yblock/.yitem, .yrecipe, .ydef, .yres, yog.toml — for the build and the editors."

[dependencies]
yog-data = "0.4.1"
# Content definitions whose format is the definition itself (`SoundGroup`).
yog-registry = "0.33.2"
# A dimension's `terrain`.
yog-worldgen = "0.1"
yog-body = "0.1"
