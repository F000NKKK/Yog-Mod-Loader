[package]
name = "yog-kit"
version = "0.11.0"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = "MIT OR Apache-2.0"
description = "Yog MVVM UI framework — view models, compiled .yui bindings, lists, focus and navigation for Yog mod screens"
repository = "https://github.com/F000NKKK/Yog-Mod-Loader"
keywords = ["minecraft", "yog", "ui", "mvvm"]
categories = ["gui", "game-development"]

[dependencies]
yog-api = { workspace = true }

# Its own tests drive screens with TestHost.
yog-sync = { workspace = true }
[dev-dependencies]
yog-kit = { workspace = true, features = ["testing"] }

[features]
# TestHost: driving a screen in unit tests; never in a mod's build.
testing = []
