[package]
name = "yog-api"
version = "0.105.3"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
# Permissive ON PURPOSE: mods link this crate, so AGPL here would force every
# mod to be AGPL and kill the ecosystem. The protected part is the runtime/host.
license = "MIT OR Apache-2.0"
description = "Yog — ergonomic Rust API for writing Minecraft mods (facade)."

[features]
# The mod sends to the server (`yog.toml`: `[network] to_server = true`, set by
# `yog build`): `net::send_to_server` takes its channels. Named by yog-ids'
# `rust_crate::API_TO_SERVER`.
to-server = []

[dependencies]
yog-ids = { workspace = true }
# Content crosses the ABI as Yog Data blobs (`register_content`).
yog-data = { workspace = true, features = ["json"] }
yog-abi = { workspace = true }
yog-core = { workspace = true }
yog-event = { workspace = true }
yog-sync = { workspace = true }
yog-registry = { workspace = true }
yog-network = { workspace = true }
yog-command = { workspace = true }
yog-dimensions = { workspace = true }
yog-logging = { workspace = true }
yog-interop = { workspace = true }
yog-storage = { workspace = true }
# Mirrors: their specs, views and writers.
yog-mirror = { workspace = true }
yog-config = { workspace = true }
yog-gfx = { workspace = true }
yog-ui = { workspace = true }
yog-book = { workspace = true }
yog-formats = { workspace = true }
yog-body = { workspace = true }
yog-inventory = { workspace = true }

ctor = { workspace = true }
