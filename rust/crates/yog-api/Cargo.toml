[package]
name = "yog-api"
version = "0.94.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
# Permissive ON PURPOSE: mods link this crate, so AGPL here would force every
# mod to be AGPL and kill the ecosystem. The protected part is the runtime/host.
license = "MIT OR Apache-2.0"
description = "Yog — ergonomic Rust API for writing Minecraft mods (facade)."

[dependencies]
# Content crosses the ABI as Yog Data blobs (`register_content`).
yog-data = { version = "0.4", features = ["json"] }
yog-abi  = "0.29.1"
yog-core = "0.3.5"
yog-event = "0.4"
yog-world = "0.3"
yog-entity = "0.3"
yog-player = "0.4.1"
yog-registry = "0.31"
yog-network = "0.1"
yog-command = "0.2"
yog-dimensions = "0.12"
yog-logging = "0.1"
yog-interop = "0.21.4"
yog-storage = "0.1"
yog-config  = "0.1"
yog-gfx     = "0.26"
yog-ui      = "0.41"
yog-book = "0.64"
yog-inventory = "0.16"


rkyv.workspace = true
ctor.workspace = true
