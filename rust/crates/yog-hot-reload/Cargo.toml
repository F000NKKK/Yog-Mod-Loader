[package]
name = "yog-hot-reload"
version = "0.10.1"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Safe dlopen/dlclose swap primitives for reloading a mod's native library without dangling references into retired code, and the control socket's protocol that asks for it."

[dependencies]
libloading = { workspace = true }
# The control channel's frames.
yog-data = { workspace = true }
# What `#[derive(Schema)]` expands to.
substrate-data = { workspace = true }
# What Yog-IDLE hands its webview (`control::ModInfo`, `Changes`).
serde = { workspace = true, features = ["derive"] }
substrate-lock = { workspace = true }

[features]
# `LoadedModule::this_process`, for tests and benchmarks; never in the loader.
testing = []
