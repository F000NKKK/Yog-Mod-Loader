[package]
name = "yog-registry"
version = "0.32.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Yog content registry — register items, blocks, recipes, etc."

[dependencies]
yog-abi = "0.29"
# Definitions cross the ABI as Yog Data (`register_content`).
yog-data = "0.4"
serde = { workspace = true, optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
serde_json.workspace = true
yog-data = { version = "0.4", features = ["json"] }
