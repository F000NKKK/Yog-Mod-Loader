[package]
name = "yog-data"
version = "0.10.2"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = "MIT OR Apache-2.0"
description = "Yog Data — the one data model, text syntax, binary form and schema system of every Yog format."
# The benchmark fixture (a real book, 145 KB) stays in the repository.
exclude = ["benches/hexbook.ybook"]

[dependencies]
# The model, text, binary, frames and schemas: Yog's domain is declared over it.
substrate-data = { workspace = true }
# The names every part shares (kinds, typed-value words, separators).
yog-codegen = { workspace = true }
yog-codegen-typescript = { workspace = true }
yog-ids = { workspace = true }
# A built-in table that won't read is reported, not a crash.
yog-logging = { workspace = true }

[features]
toml = ["substrate-data/toml"]
json = ["substrate-data/json"]

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
serde_json = { workspace = true }
# benches/versus: the formats yog-data replaced.
serde = { workspace = true }
rkyv = { workspace = true }
postcard = { workspace = true }

[[bench]]
name = "data"
harness = false

[[bench]]
name = "messages"
harness = false

[[bench]]
name = "versus"
harness = false
