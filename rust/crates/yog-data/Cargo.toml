[package]
name = "yog-data"
version = "0.13.0"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = "MIT OR Apache-2.0"
description = "Yog Data — Yog's domain over Substrate Data: kinds of content, tags, .yres entries, texts, images and colours."
# The test fixture (a real book, 145 KB) stays in the repository.
exclude = ["tests/hexbook.ybook"]

[dependencies]
# The model, text, binary, frames and schemas: Yog's domain is declared over it.
substrate-data = { workspace = true }
# The names every part shares (kinds, typed-value words, separators).
yog-codegen = { workspace = true }
yog-codegen-typescript = { workspace = true }
yog-ids = { workspace = true }
# A built-in table that won't read is reported, not a crash.
yog-logging = { workspace = true }

[features]
toml = ["substrate-data/toml"]
json = ["substrate-data/json"]

[dev-dependencies]
# What the bus test's compact types hold.
yog-sync = { workspace = true }
