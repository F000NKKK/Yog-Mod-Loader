[package]
name = "yog-data"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Yog Data — the one data model, text syntax, binary form and schema system of every Yog format."
# The benchmark fixture (a real book, 145 KB) stays in the repository.
exclude = ["benches/hexbook.ybook"]

[dependencies]
yog-data-derive = { version = "0.2", path = "../yog-data-derive" }
# `yog.toml` read into the model (`toml` feature).
toml = { version = "1", optional = true, default-features = false, features = ["std", "parse", "preserve_order"] }
serde_spanned = { version = "1", optional = true }

[features]
toml = ["dep:toml", "dep:serde_spanned"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json.workspace = true

[[bench]]
name = "data"
harness = false
