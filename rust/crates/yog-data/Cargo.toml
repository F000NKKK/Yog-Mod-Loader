[package]
name = "yog-data"
version = "0.5.0"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = "MIT OR Apache-2.0"
description = "Yog Data — the one data model, text syntax, binary form and schema system of every Yog format."
# The benchmark fixture (a real book, 145 KB) stays in the repository.
exclude = ["benches/hexbook.ybook"]

[dependencies]
# The names every part shares (namespaces, kinds, typed-value words).
yog-ids = { workspace = true }
base64 = { workspace = true }
yog-data-derive = { workspace = true }
# The arena borrowed values' lists and maps live in (`ValueRef`).
bumpalo = { workspace = true, features = ["collections"] }
# `yog.toml` read into the model (`toml` feature).
toml = { workspace = true, features = ["std", "parse", "preserve_order"], optional = true }
serde_spanned = { workspace = true, optional = true }

# JSON ⇄ Yog Data (`json` feature).
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
toml = ["dep:toml", "dep:serde_spanned"]
json = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
serde_json = { workspace = true }

[[bench]]
name = "data"
harness = false
