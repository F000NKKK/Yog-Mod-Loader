[package]
name = "yog-script-analyze"
version = "0.2.2"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = "MIT OR Apache-2.0"
description = "Yog Script (.ys, .yns) analyzed: its lexer, parser and syntax tree, names resolved, the class index model — what the build and the editors read a source with."

[dependencies]
# Yog Script's names.
yog-script-ids = { workspace = true }
# Problem codes, file formats.
yog-ids = { workspace = true }
# Problems as Diagnostics, positions.
yog-analysis = { workspace = true }
# C#'s names to the game's Java ones.
yog-codegen = { workspace = true }
yog-data = { workspace = true }
# Yog's surface (its services, handles, events): what a `.ys` reaches.
yog-event = { workspace = true }
# The content kinds a source declares (`block`, `item`): their definitions' shapes.
yog-sync = { workspace = true }
# Versions compared the one way Yog does (`#if mc >= 1.21`, `targets`).
yog-home = { workspace = true }
