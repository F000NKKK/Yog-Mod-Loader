[package]
name = "yog-storage"
version = "0.8.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT OR Apache-2.0"
description = "Yog persistent key-value storage for mod data."

[dependencies]
yog-ids = { workspace = true }
# The stores' files: binary Yog Data.
yog-data = { workspace = true }
# What `#[derive(Schema)]` expands to.
substrate-data = { workspace = true }
# A store shared by its handles.
yog-sync = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }

[[bench]]
name = "records"
harness = false
