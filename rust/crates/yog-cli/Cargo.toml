[package]
name = "yog-cli"
version = "0.44.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Yog build tool — `yog build` compiles a mod and packages it as .yog."

[lib]
path = "src/lib.rs"

[[bin]]
name = "yog"
path = "src/main.rs"

[dependencies]
# `yog publish exports` reads `#[yog_export]` items with syn, by their exact text.
syn.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
zip.workspace = true
serde_json.workspace = true
# Image sources (`item:`, `sprite:`, ...) checked in .yui files.
yog-gfx = { workspace = true }
# Themes (`<Screen theme>`) applied to .yui elements.
yog-ui = { workspace = true }
yog-book = { workspace = true }
yog-body = { workspace = true }
yog-font = { workspace = true }
yog-registry = { workspace = true }
# The data model, text syntax and schemas of every Yog format.
yog-data = { workspace = true, features = ["toml"] }
# The schemas of the source formats.
yog-formats = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
yog-worldgen = { workspace = true }

[[bench]]
name = "exports"
harness = false

[[bench]]
name = "yui"
harness = false

[[bench]]
name = "yres"
harness = false

[[bench]]
name = "content"
harness = false
