[package]
name = "yog-cli"
version = "0.44.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Yog build tool — `yog build` compiles a mod and packages it as .yog."

[lib]
path = "src/lib.rs"

[[bin]]
name = "yog"
path = "src/main.rs"

[dependencies]
# `yog publish exports` reads `#[yog_export]` items with syn, by their exact text.
syn.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
zip.workspace = true
serde_json.workspace = true
# Image sources (`item:`, `sprite:`, ...) checked in .yui files.
yog-gfx = "0.28"
# Themes (`<Screen theme>`) applied to .yui elements.
yog-ui = "0.43"
yog-book = "0.66"
yog-body = "0.2"
yog-font = "0.1"
yog-registry = "0.34"
# The data model, text syntax and schemas of every Yog format.
yog-data = { version = "0.4.1", features = ["toml"] }
# The schemas of the source formats.
yog-formats = "0.9"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
yog-worldgen = "0.1"

[[bench]]
name = "exports"
harness = false

[[bench]]
name = "yui"
harness = false

[[bench]]
name = "yres"
harness = false

[[bench]]
name = "content"
harness = false
