[package]
name = "yog-cli"
version = "0.53.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT OR Apache-2.0"
description = "Yog build tool — `yog build` compiles a mod and packages it as .yog."

[lib]
path = "src/lib.rs"

[[bin]]
name = "yog"
path = "src/main.rs"

[dependencies]
yog-analysis = { workspace = true }
yog-codegen = { workspace = true }
yog-codegen-rust = { workspace = true }
yog-sync = { workspace = true }
# The library's warnings; the program says where they go (stderr).
yog-logging = { workspace = true }
yog-ids = { workspace = true }
# Minecraft's names: the hosts' mapping tables, the game's downloads.
yog-mappings = { workspace = true }
# Yog Script's compiler: a mod's .ys/.yns checked by `yog build`/`yog check` and the editors.
yog-script-build = { workspace = true }
# `yog control`: the running game's control channel.
yog-hot-reload = { workspace = true }
yog-media = { workspace = true }
# `yog publish exports` reads `#[yog_export]` items with syn, by their exact text.
syn = { workspace = true, features = ["visit"] }
proc-macro2 = { workspace = true, features = ["span-locations"] }
zip = { workspace = true }
# `yog mappings` fetches the game's mappings.
ureq = { workspace = true }
# The mapping table's types (what the hosts read).
yog-event = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# Image sources (`item:`, `sprite:`, ...) checked in .yui files.
yog-gfx = { workspace = true }
# Themes (`<Screen theme>`) applied to .yui elements.
yog-ui = { workspace = true }
yog-book = { workspace = true }
yog-body = { workspace = true }
yog-font = { workspace = true }
yog-registry = { workspace = true }
# The data model, text syntax and schemas of every Yog format.
yog-data = { workspace = true, features = ["toml", "json"] }
# The schemas of the source formats.
yog-formats = { workspace = true }
# The designers (`design`): screens drawn by yog-ui through a recording
# `YogGfxApi`, with Minecraft's font and textures from the local client jar;
# a mod's library loaded to draw its custom components; terrain previews.
yog-abi = { workspace = true }
yog-graphics = { workspace = true }
yog-worldgen = { workspace = true }
serde = { workspace = true }
toml = { workspace = true, features = ["std", "parse"] }
fontdue = { workspace = true }
png = { workspace = true }
libloading = { workspace = true }
quick-xml = { workspace = true }
# A .gitignore-aware walk of the mod's sources; where the game's client jars are.
ignore = { workspace = true }
dirs = { workspace = true }
# Yog's home: the run targets `yog run` launches.
yog-home = { workspace = true }

# Not built against: its version is the one the mods' generated manifests
# ask for (build.rs reads it), and as a build dependency it travels inside
# the published manifest, where the workspace root isn't.
[build-dependencies]

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }
yog-worldgen = { workspace = true }

[[bench]]
name = "exports"
harness = false

[[bench]]
name = "yui"
harness = false

[[bench]]
name = "yres"
harness = false

[[bench]]
name = "content"
harness = false

[[bench]]
name = "design"
harness = false
