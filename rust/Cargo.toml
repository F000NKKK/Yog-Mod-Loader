[workspace]
resolver = "2"
members = [
    # stable C ABI shared between mods and the runtime (permissive)
    "crates/yog-abi",
    # domain crates (permissive — see LICENSING.md)
    "crates/yog-core",
    "crates/yog-event",
    "crates/yog-registry",
    "crates/yog-network",
    "crates/yog-command",
    "crates/yog-dimensions",
    # declarative terrain: noise, layers, caves, ores — the runtime's and the IDE's preview
    "crates/yog-worldgen",
    # the names every part shares (namespaces, kinds, schemes, Yog's ids), exported to TS/Java
    "crates/yog-ids",
    # Media as the game takes it: pictures (and sound, video) in any format
    "crates/yog-media",
    # graphics primitives every crate shares: colors, vectors, rects, paths, images, a rasterizer
    "crates/yog-graphics",
    # fonts: one format for every text of the system, shaping and rasterizing
    "crates/yog-font",
    # the one data model / text / binary / schema of every Yog format
    "crates/yog-data",
    "crates/yog-data-derive",
    # the schemas of the source formats, for the build and the editors
    "crates/yog-formats",
    # infrastructure (permissive)
    # Yog's home on a machine: installed components, the local patch, run targets
    "crates/yog-home",
    "crates/yog-logging",
    "crates/yog-mirror",
    # locks that outlive a panic
    "crates/yog-sync",
    "crates/yog-storage",
    "crates/yog-config",
    # facade mod authors depend on
    "crates/yog-api",
    # in-game book/documentation system (Patchouli-like)
    "crates/yog-book",
    # bodies: skeletons, animations, morphs, camera, movement
    "crates/yog-body",
    # graphics subsystem — low-level GL pipeline access for mods (permissive)
    "crates/yog-gfx",
    # UI framework — flexbox layout + widgets on top of yog-gfx
    "crates/yog-ui",
    # MVVM screens on top of yog-ui (.yui x:ViewModel codegen target)
    "crates/yog-kit",
    # inventory framework — real Container/Menu screens (BlockEntity-backed)
    "crates/yog-inventory",
    # inter-mod communication (proc-macros)
    "crates/yog-interop",
    # build tooling
    # Yog Script: the language a mod is written in (parser, syntax tree)
    "crates/yog-script",
    "crates/yog-cli",
    # engine (AGPL)
    "crates/yog-runtime",
    # debugging/hot-reload stack (AGPL — engine-internal tooling)
    "crates/yog-symbols",
    "crates/yog-hot-reload",
    "crates/yog-debugger",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["F000NK, Yog Team, Voluntas Progressus"]
# Default for the protected engine (runtime + host). The mod-author-facing
# `yog-api` overrides this with a permissive license so the
# mod ecosystem stays free — see LICENSING.md.
license = "AGPL-3.0-only"

[workspace.dependencies]
bumpalo = "3"
const_format = "0.2.36"
# Names composed in macros (`actions!`'s functions: `GiveItem` → `give_item`).
pastey = "0.2.3"
criterion = { version = "0.8", default-features = false }
libc = "0.2"
resvg = { version = "0.48", default-features = false }
serde_spanned = "1"
toml = { version = "1", default-features = false }
yog-abi = { version = "0.32.1", path = "crates/yog-abi" }
yog-api = { version = "0.103.0", path = "crates/yog-api" }
yog-body = { version = "0.7.0", path = "crates/yog-body" }
yog-book = { version = "0.72.0", path = "crates/yog-book" }
yog-command = { version = "0.4.0", path = "crates/yog-command" }
yog-config = { version = "0.3.0", path = "crates/yog-config" }
yog-core = { version = "0.9.0", path = "crates/yog-core" }
yog-data = { version = "0.9.0", path = "crates/yog-data" }
yog-data-derive = { version = "0.7.0", path = "crates/yog-data-derive" }
yog-dimensions = { version = "0.16.0", path = "crates/yog-dimensions" }
yog-event = { version = "0.10.0", path = "crates/yog-event" }
yog-font = { version = "0.6.0", path = "crates/yog-font" }
yog-formats = { version = "0.14.0", path = "crates/yog-formats" }
yog-gfx = { version = "0.33.0", path = "crates/yog-gfx" }
yog-graphics = { version = "0.6.0", path = "crates/yog-graphics" }
yog-home = { version = "0.5.0", path = "crates/yog-home" }
yog-hot-reload = { version = "0.5.0", path = "crates/yog-hot-reload" }
yog-ids = { version = "0.5.0", path = "crates/yog-ids" }
yog-mirror = { version = "0.2.0", path = "crates/yog-mirror" }
yog-sync = { version = "0.4.0", path = "crates/yog-sync" }
yog-media = { version = "0.6.0", path = "crates/yog-media" }
yog-interop = { version = "0.24.0", path = "crates/yog-interop" }
yog-kit = { version = "0.14.0", path = "crates/yog-kit" }
yog-inventory = { version = "0.23.0", path = "crates/yog-inventory" }
yog-logging = { version = "0.3.0", path = "crates/yog-logging" }
yog-network = { version = "0.4.0", path = "crates/yog-network" }
yog-registry = { version = "0.40.0", path = "crates/yog-registry" }
yog-script = { version = "0.2.0", path = "crates/yog-script" }
yog-storage = { version = "0.4.0", path = "crates/yog-storage" }
yog-symbols = { version = "0.7.0", path = "crates/yog-symbols" }
yog-ui = { version = "0.48.0", path = "crates/yog-ui" }
yog-worldgen = { version = "0.6.0", path = "crates/yog-worldgen" }
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"
proc-macro-crate = "3.5.0"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
linkme = "0.3"
serde_json = "1"
# What yog-data's benchmarks measure it against (dev only).
rkyv = "0.8"
postcard = { version = "1", features = ["alloc"] }
semver = "1"
png = "0.18"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tga"] }
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
jni = "0.21"
libloading = "0.9"
fontdue = "0.9"
dirs = "7"
ignore = "0.4.33"
quick-xml = "0.42"
glow = "0.18"
ctor = "1"
object = "0.40"
gimli = "0.34"
addr2line = "0.27"
nix = { version = "0.31", features = ["ptrace", "signal", "process"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }

[patch.crates-io]
