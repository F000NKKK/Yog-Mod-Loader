# NeoForge toolchain versions for Minecraft 1.20.1.
# The 1.20.1 line is published under the legacy "forge" artifact id.
neo_version=1.20.1-47.1.106
neo_artifact=forge
java_version=17
# ported = compiles and runs; scaffold = build plumbing only, sources not ported yet
minecraft_version_range=[1.20.1,1.21)
status=ported
# The 1.20.1 line is Forge 47's API: its host sources are Forge's.
platform_dir=../forge/platforms/1.20.1
# MixinExtras, jar-in-jar: this line's loader doesn't ship it (nanites' @Local).
mixinextras_version=0.4.1
# Its dedicated server's LAN announcement crashes a dev run (neoforge/build.gradle).
dev_lan_announce_off=true
