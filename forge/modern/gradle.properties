# The unobfuscated Minecraft releases this project builds (see ../versions/).
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# One output directory for classes and resources (Forge's dev launch wants one mod file).
net.minecraftforge.gradle.merge-source-sets=true

minecraft_version=26.2

maven_group=dev.yog
archives_base_name=yog-forge
