// The Forge host for Minecraft's unobfuscated releases (26.1 on): its own
// Gradle project, since ForgeGradle 7 needs a newer Gradle than ../ builds
// 1.20.1 and 1.21.1 with (ForgeGradle 6). Sources and versions are ../'s
// (platforms/<mc>, versions/<mc>.properties).
pluginManagement {
    repositories {
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'yog'
