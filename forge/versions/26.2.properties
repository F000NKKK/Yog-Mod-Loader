# Forge toolchain versions for Minecraft 26.2 — the game ships unobfuscated
# from 26.1, so there are no mappings or refmaps: sources use the game's own
# names. Built by the Gradle project in modern/ (Gradle 9.8, ForgeGradle 7).
gradle_project=modern
forge_version=26.2-65.1.5
java_version=25
minecraft_version_range=[26.2,26.3)
# ported = compiles and runs; scaffold = build plumbing only, sources not ported yet
status=ported
